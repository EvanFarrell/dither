<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dither</title>
<meta name="description" content="Browse and recolor dithered scenes, save a PNG, or record an animated loop.">
<meta name="theme-color" content="#111317">
<style>
:root {
  color-scheme: dark;
  --surface: #111317;
  --panel: #16191f;
  --line: #2c3038;
  --text: #e8eaf0;
  --muted: #a1a8b5;
  --accent: #b9ebd2;
  --rail-width: 232px;
  font: 13px system-ui, sans-serif;
  background: var(--surface);
  color: var(--text);
}
* { box-sizing: border-box; }
body { margin: 0; }
button, select {
  min-height: 34px;
  font: inherit;
  color: inherit;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 5px 10px;
  cursor: pointer;
}
button:hover, select:hover { border-color: #757d8b; }
button:disabled { opacity: .45; cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
a { color: var(--muted); text-decoration: none; }
a:hover { color: var(--text); }
.app {
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  height: 100vh;
  height: 100dvh;
}
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  min-height: 56px;
  padding: 8px 18px;
  border-bottom: 1px solid var(--line);
}
.brand { margin: 0; font-size: 22px; font-weight: 650; letter-spacing: -.055em; }
.top-actions, .stepper { display: flex; align-items: center; gap: 8px; }
#save-png { background: var(--accent); border-color: var(--accent); color: #131d18; font-weight: 650; }
#save-png:hover { background: #d4f6e5; }
.workspace { display: grid; grid-template-columns: var(--rail-width) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); min-height: 0; }
.library {
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  min-width: 0;
  border-right: 1px solid var(--line);
  background: var(--panel);
}
.library-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 4px;
  padding: 16px 15px 12px;
  border-bottom: 1px solid var(--line);
}
.library-header h2 { margin: 0; font-size: 14px; }
#scene-count { color: var(--muted); font: 12px ui-monospace, monospace; }
#scene-list {
  overflow-y: auto;
  overflow-x: hidden;
  overscroll-behavior-y: contain;
  scrollbar-width: thin;
  scrollbar-color: #535d6c transparent;
  scrollbar-gutter: stable;
  padding: 0 8px 12px;
}
.scene-group h3 {
  margin: 15px 7px 6px;
  color: var(--muted);
  font-size: 10px;
  font-weight: 650;
  letter-spacing: .09em;
  text-transform: uppercase;
}
.scene-button {
  display: flex;
  align-items: center;
  gap: 9px;
  width: 100%;
  min-width: 0;
  padding: 5px;
  text-align: left;
  color: #cdd2dd;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 6px;
}
.scene-button:hover { background: #20252d; border-color: var(--line); }
.scene-button[aria-current="true"] { background: #22332e; color: #e2f7ec; border-color: #618c79; }
.scene-thumb { width: 72px; height: auto; flex: none; border-radius: 3px; image-rendering: pixelated; }
.editor { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-width: 0; min-height: 0; }
.scene-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  padding: 11px 16px;
  min-height: 58px;
  border-bottom: 1px solid var(--line);
}
.scene-heading { display: flex; align-items: baseline; flex-wrap: wrap; gap: 3px 8px; min-width: 0; }
#scene-category { color: var(--muted); font-size: 11px; }
#scene-name { margin: 0; font-size: 17px; font-weight: 600; }
.stepper { gap: 5px; }
.stepper button { width: 34px; padding: 0; font-size: 15px; }
.preview-area { position: relative; padding: 14px; min-height: 0; min-width: 0; background: #0b0d10; }
.preview {
  position: relative;
  container-type: size;
  display: grid;
  place-items: center;
  width: 100%;
  height: 100%;
  overflow: hidden;
}
#c {
  display: block;
  width: min(100cqw, calc(100cqh * var(--preview-ratio, 1.7778)));
  height: auto;
  image-rendering: pixelated;
  cursor: pointer;
  outline: 1px solid var(--line);
}
#gate { position: absolute; inset: 0; display: none; place-items: center; background: #0b0d105e; }
#gate.on { display: grid; }
#gt { box-shadow: 0 4px 22px #0008; }
.toolbar {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px 16px;
  padding: 10px 14px;
  border-top: 1px solid var(--line);
  background: var(--panel);
}
.tool-group { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; }
.tool-group label, #image-margin { color: var(--muted); }
.tool-group label { margin-right: 2px; }
#as { max-width: min(160px, 100%); }
#rec.on { background: #842d3b; color: #fff; }
#ap.on { border-color: #7cf; color: #7cf; }
#out {
  position: absolute;
  top: 12px;
  right: 12px;
  display: none;
  width: min(340px, calc(100% - 24px));
  max-height: calc(100% - 24px);
  overflow: auto;
  padding: 10px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
}
#out video { display: block; width: 100%; margin-bottom: 8px; }
#out a { margin-right: 10px; color: var(--accent); }
@media (max-width: 640px) {
  :root { --rail-width: 112px; }
  .topbar { padding-inline: 10px; }
  .library-header { padding-inline: 9px; }
  #scene-list { padding-inline: 4px; }
  .scene-group h3 { margin-left: 4px; font-size: 9px; letter-spacing: .04em; }
  .scene-button { flex-direction: column; align-items: start; gap: 3px; font-size: 11px; }
  .scene-thumb { width: 100%; }
  .scene-header { padding: 7px 8px; }
  .scene-heading { display: grid; gap: 0; }
  #scene-name { font-size: 15px; }
  .stepper button { width: 28px; min-height: 30px; }
  .preview-area { padding: 6px; }
  .toolbar { gap: 5px; padding: 6px; max-height: 35dvh; overflow-y: auto; }
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <h1 class="brand">Dither</h1>
    <div class="top-actions">
      <a href="https://github.com/EvanFarrell/dither" target="_blank" rel="noopener">GitHub ↗</a>
      <button id="save-png" type="button">Save PNG</button>
    </div>
  </header>
  <div class="workspace">
    <aside class="library" aria-labelledby="library-title">
      <div class="library-header">
        <h2 id="library-title">Scenes</h2>
        <span id="scene-count"></span>
      </div>
      <nav id="scene-list" aria-label="Scenes"></nav>
    </aside>
    <main class="editor">
      <div class="scene-header">
        <div class="scene-heading" aria-live="polite">
          <span id="scene-category"></span>
          <h2 id="scene-name"></h2>
        </div>
        <div class="stepper">
          <button id="pe" type="button" aria-label="Previous scene" title="Previous scene (←)">←</button>
          <button id="ne" type="button" aria-label="Next scene" title="Next scene (→)">→</button>
        </div>
      </div>
      <div class="preview-area">
        <div class="preview">
          <canvas id="c" aria-label="Scene preview"></canvas>
          <div id="gate"><button id="gt" type="button">▶ Click to start</button></div>
        </div>
        <div id="out">
          <video id="v" controls loop muted playsinline></video>
          <a id="dl" download="dither.webm">Download video</a>
          <a href="#" id="cl">Close</a>
        </div>
      </div>
      <div class="toolbar">
        <div class="tool-group">
          <label for="palette">Palette</label>
          <select id="palette" title="Cycle palettes with P"></select>
        </div>
        <div class="tool-group" role="group" aria-label="Image">
          <button id="add-image" type="button" title="Choose, paste, or drop an image">Add image</button>
          <input id="image-file" type="file" accept="image/*" hidden>
          <button id="zo" type="button" aria-label="Decrease background margin" disabled>−</button>
          <output id="image-margin" aria-label="Background margin" hidden></output>
          <button id="zi" type="button" aria-label="Increase background margin" disabled>+</button>
          <button id="ci" type="button" disabled>Clear image</button>
        </div>
        <div class="tool-group">
          <label for="as">Audio</label>
          <select id="as"></select>
          <button id="ap" type="button" aria-label="Preview audio" title="Preview audio" disabled>♪</button>
          <input id="af" type="file" accept="audio/*" hidden>
        </div>
        <div class="tool-group" role="group" aria-label="Video">
          <button id="rec" type="button" title="Record a six-second clip">● 6s</button>
          <button id="rl" type="button" title="Record a seamless loop">↻ Loop</button>
        </div>
      </div>
    </main>
  </div>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
