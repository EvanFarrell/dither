<style>
html,body{margin:0;height:100%;background:#000;}
body{display:flex;align-items:center;justify-content:center;padding-bottom:50px;box-sizing:border-box;overflow:hidden;font:11px monospace;color:#999}
canvas{display:block;image-rendering:pixelated;cursor:pointer}
#ui{position:fixed;left:10px;bottom:8px;right:10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
button,select{font:11px monospace;background:#111;color:#ddd;border:1px solid #333;padding:4px 7px;cursor:pointer}
button:hover,select:hover{border-color:#888}
#src,#fxl{font:11px monospace;color:#888;text-decoration:none;border:1px solid #333;padding:4px 7px}
#src:hover,#fxl:hover{border-color:#888;color:#ddd}
select{max-width:165px}
#rec.on{background:#a00;color:#fff}
#ap.on{border-color:#7cf;color:#7cf}
#ap:disabled{opacity:.4;cursor:default}
#pz{border:1px dashed #555;padding:4px 8px;color:#888;outline:none;white-space:nowrap;overflow:hidden;width:130px;height:13px}
#out{position:fixed;right:10px;top:10px;display:none;background:#111;border:1px solid #333;padding:8px;width:320px}
#out video{width:100%;display:block;margin-bottom:6px}
#out a{color:#7cf}
#gate{position:fixed;inset:0 0 50px 0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.45);cursor:pointer;z-index:10}
#gate.on{display:flex}
#gate span{background:#111;color:#eee;border:1px solid #555;padding:10px 18px;font:12px monospace;letter-spacing:.04em}
#gate:hover span{border-color:#fff}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="gate"><span id="gt">▶ click to start</span></div>
<div id="ui">
  <a id="src" href="https://github.com/rauchg/retro-loops" target="_blank" rel="noopener">source ↗</a>
  <a id="fxl" href="https://fx.sh" target="_blank" rel="noopener" title="made with fx">fx.sh ↗</a>
  <button id="pe">◀</button>
  <select id="es" aria-label="Effect"></select>
  <button id="ne">▶</button>
  <button id="pp">palette</button>
  <div id="pz" contenteditable="true">click here, then ⌘V</div>
  <span>bg</span><button id="zo">−</button><button id="zi">+</button>
  <button id="ci">clear</button>
  <select id="as" aria-label="Audio"></select>
  <button id="ap" title="Preview audio" disabled>♪</button>
  <input id="af" type="file" accept="audio/*" hidden>
  <button id="rec">● 6s</button>
  <button id="rl">↻ loop</button>
  <span id="l"></span>
</div>
<div id="out"><video id="v" controls loop muted playsinline></video><a id="dl" download="dither.webm">download</a> · <a href="#" id="cl">close</a><div style="margin-top:4px;color:#666">if download is blocked, right-click the video → save</div></div>
<script type="module" src="./app.js"></script>
</body>
</html>
